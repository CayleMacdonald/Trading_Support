<style>
:root{--up:#2BB673;--down:#E5566D;--bg:#09090b;--panel:#111114;--line:#27272a;--mut:#a1a1aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:#e4e4e7;font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chip{padding:.3rem .8rem;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap;background:transparent;transition:background .15s,color .15s}
.chip:hover{color:#fff;border-color:#3f3f46}
.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chip.on{background:#fafafa;color:#09090b;border-color:#fafafa}
.pill{display:inline-flex;align-items:center;gap:.45rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);opacity:.35}
.pill.on{color:#fff;border-color:var(--c);background:#18181b}
.pill.on i{opacity:1}
.up{color:var(--up)}.down{color:var(--down)}
.scroll-x{overflow-x:auto;scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
#main.cr,#main.cr *{cursor:crosshair!important}#main.mv,#main.mv *{cursor:move!important}
html.mobile body{max-width:480px;margin:0 auto;border-left:1px solid #18181b;border-right:1px solid #18181b}
html.mobile #mainRow{flex-direction:column!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch}
html.mobile #chartSec{height:62dvh!important;flex:none!important}
html.mobile #side{width:100%!important;border-left:0!important;border-top:1px solid #27272a;overflow:visible!important;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}
html.mobile .chip{min-height:38px;padding:.4rem .9rem;font-size:.9rem}
html.mobile #tools,html.mobile #tfs,html.mobile #draw{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;max-width:100%}
html.mobile #pairSel,html.mobile input,html.mobile select{font-size:16px!important;min-height:40px}
html.mobile #legend{font-size:10px;max-width:92%}
html.mobile #price{font-size:1.9rem}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:.4rem .8rem;border:1px solid var(--line);border-radius:12px;font-size:.78rem;background:var(--panel);cursor:pointer;min-width:138px;text-align:left;color:var(--mut)}
.tab b{font-size:.9rem;color:inherit}.tab i{font-style:normal;font-size:.68rem;opacity:.85}.tab.on{border-color:var(--up);box-shadow:0 0 0 1px var(--up)}
html.light{--bg:#F5F7FA;--panel:#FFFFFF;--line:#E3E8EF;--mut:#64748b}
html.light body{color:#334155}html.light .bg-zinc-900{background:#fff!important}
html.light .border-zinc-800,html.light .border-zinc-700{border-color:#E3E8EF!important}
html.light .text-zinc-400,html.light .text-zinc-500{color:#64748b!important}
html.light .text-zinc-300,html.light .text-zinc-200,html.light .text-zinc-100{color:#334155!important}
html.light .divide-zinc-800>*+*{border-color:#E3E8EF!important}
html.light .chip.on{background:#334155;color:#fff;border-color:#334155}html.light .pill.on{background:#fff;color:#334155}
html.light .chip:hover{color:#0f172a}
/* ---- polish: cards, segmented controls, quieter chrome ---- */
:root{--accent:#6c8cf0;--seg:#18181b;--ink:#fafafa;--shadow:none}

#mainRow{gap:12px;padding:12px}

#chartSec{overflow:hidden}#side{padding:18px!important}
#side h2,#side h3{font-size:.8rem;font-weight:600;color:var(--mut)}
#tfs,#tools{background:var(--seg);border-radius:10px;padding:3px;gap:2px!important}
#tfs .chip,#tools .chip{border:0;border-radius:8px;padding:.28rem .75rem;background:transparent;color:var(--mut)}
#tfs .chip:hover,#tools .chip:hover{color:var(--ink)}
#tfs .chip.on,#tools .chip.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.12)}

.tab:hover{background:var(--seg)}

<body>
<div class="flex flex-col h-full">
  <header class="px-4 pt-3 pb-2 border-b border-zinc-800">
    <div class="flex items-center gap-2 mb-2"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#111114" stroke="#27272a" stroke-width="2"/><circle cx="32" cy="32" r="24" fill="none" stroke="#3f3f46" stroke-width="2"/><g stroke-width="2.4" stroke-linecap="round"><path d="M18 34V52" stroke="#E5566D"/><path d="M32 26V46" stroke="#2BB673"/><path d="M46 14V38" stroke="#2BB673"/></g><rect x="14" y="40" width="8" height="8" rx="1.5" fill="#E5566D"/><rect x="28" y="30" width="8" height="12" rx="1.5" fill="#2BB673"/><rect x="42" y="18" width="8" height="14" rx="1.5" fill="#2BB673"/></svg><span class="text-base font-bold tracking-tight">FX<span style="color:var(--up)"> Lens</span></span><span class="text-xs text-zinc-500">Forex tracker</span><button id="themeBtn" class="chip ml-auto">Soft dark</button><button id="modeBtn" class="chip" aria-label="Switch between mobile and desktop layout">Mobile view</button></div>
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
      <div>
        <div class="text-sm text-zinc-400" id="pairName">EUR/USD</div>
        <div class="flex items-baseline gap-3">
          <span class="text-3xl font-semibold tracking-tight" id="price">–</span>
          <span class="text-sm font-medium" id="chg">–</span>
        </div>
      </div>
      <nav id="pairTabs" class="flex gap-2 overflow-x-auto max-w-full" aria-label="Currency pair"></nav>
    </div>
  <div class="mt-2 flex items-center gap-2 text-xs">
      <span id="status" class="min-w-0 flex-1 text-zinc-400">Loading…</span>
      <button id="refresh" class="chip" title="Fetch the latest data now">Refresh</button>
      <div class="relative"><button id="gear" class="chip" aria-haspopup="true" aria-expanded="false" title="Data settings">Data key</button>
        <div id="keyMenu" class="hidden absolute right-0 top-full z-30 mt-1 w-72 rounded-xl border p-3 shadow-lg" style="background:var(--panel);border-color:var(--line)">
          <label for="key" class="text-xs text-zinc-400">Alpha Vantage key (needed for USD/JPY)</label>
          <input id="key" type="password" autocomplete="off" placeholder="Paste your free key" class="mt-1 w-full rounded-lg border px-3 py-1.5 text-sm" style="background:var(--bg);border-color:var(--line);color:inherit"></div></div>
    </div>
  </header>

  <div id="mainRow" class="flex-1 min-h-0 flex flex-col lg:flex-row overflow-y-auto lg:overflow-visible">
    <section id="chartSec" class="h-[64dvh] lg:h-auto lg:flex-1 shrink-0 lg:shrink flex flex-col min-w-0 min-h-0">
      <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2">
        <div class="flex gap-1.5" id="tfs" aria-label="Timeframe"></div>
        <div class="flex items-center gap-1.5 max-w-full"><div class="scroll-x flex gap-1.5" id="tools"></div><div id="indWrap" class="relative shrink-0"></div></div>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 px-4 pb-2"><div id="draw" class="flex flex-wrap items-center gap-1.5"></div><button id="delSel" data-act="delsel" class="chip hidden">Delete selected</button></div>
      <div class="relative flex-1 min-h-0">
        <div id="legend" class="absolute left-4 top-1 z-10 text-xs text-zinc-400 pointer-events-none"></div>
        <div id="main" class="absolute inset-0"></div>
        <canvas id="ov" style="position:absolute;left:0;top:0;pointer-events:none;z-index:5"></canvas>
      </div>
      <div id="rsiWrap" class="hidden h-28 border-t border-zinc-800 relative">
        <div class="absolute left-4 top-1 z-10 text-xs text-zinc-400 pointer-events-none">RSI 14 <span id="rsiVal" class="text-zinc-200"></span></div>
        <div id="rsi" class="absolute inset-0"></div>
      </div>
    </section>

    <aside id="side" class="lg:w-[22rem] shrink-0 border-t lg:border-t-0 lg:border-l border-zinc-800 p-4 lg:overflow-y-auto" style="background:var(--panel)">
      <button id="mktBtn" class="mb-4 w-full rounded-lg border px-3 py-2 text-left text-sm font-medium" style="border-color:var(--line);background:var(--panel)">Market analysis <span class="font-normal text-zinc-400">· hourly updates, BOS and CHoCH</span></button>
      <div id="ai" class="pb-4 mb-4 border-b border-zinc-800"></div>
      <div id="drawAI" class="hidden pb-4 mb-4 border-b border-zinc-800"></div>
      <h2 class="text-sm text-zinc-400">Trend insights</h2>
      <div class="mt-2 text-2xl font-semibold leading-tight" id="trend">–</div>
      <p class="mt-2 text-sm text-zinc-400 leading-relaxed" id="summary"></p>
      <dl class="mt-4 divide-y divide-zinc-800 text-sm" id="stats"></dl>
      <p class="mt-4 text-xs text-zinc-500">EUR/USD, GBP/USD and gold come from Binance (stablecoin-quoted, close to spot). USD/JPY comes from Alpha Vantage. Not financial advice.</p>
    </aside>
  </div>
</div>

<div id="mkt" class="hidden fixed inset-y-0 right-0 z-50 w-full max-w-md overflow-y-auto p-4 shadow-2xl" style="background:var(--panel);border-left:1px solid var(--line)"><div class="flex items-center justify-between"><h2 class="text-lg font-semibold">Market analysis</h2><button id="mktX" class="chip">Close</button></div><div id="mktBody" class="mt-2"></div></div>
<script>
const $=id=>document.getElementById(id);
if(!window.LightweightCharts){document.body.insertAdjacentHTML('afterbegin','<p style="padding:1rem;color:#E5566D">The charting library failed to load. Check your connection and reload.</p>');throw new Error('lightweight-charts missing')}
const PAIRS={'EUR/USD':{base:1.0862,d:5,vol:.005,seed:11},'USD/JPY':{base:149.35,d:3,vol:.006,seed:23},'GBP/USD':{base:1.2946,d:5,vol:.0055,seed:37},'XAU/USD':{base:2648.4,d:2,vol:.01,seed:51}};
const TFS={'5min':[300,144,'12 hours'],'1H':[3600,120,'5 days'],'5H':[18000,120,'25 days'],'1D':[900,96,'1 day'],'1W':[3600,168,'1 week'],'1M':[14400,180,'1 month'],'3M':[86400,90,'3 months'],'1Y':[86400,365,'1 year']};
const state={pair:'EUR/USD',tf:'1M',type:'candle',ind:{sma20:1,sma50:1,ema9:1,bb:0,sr:1,auto:0,sess:0,struct:1,rsi:1}};
const TOOLS=[['candle','Candles'],['line','Line'],'|',['sma20','SMA 20','#facc15'],['sma50','SMA 50','#38bdf8'],['bb','Bollinger bands','#c084fc'],['sr','Support & resistance','#94a3b8'],['ema9','EMA 9','#d6467a'],['auto','Auto trend lines','#8b8fa8'],['sess','Sessions','#e9a14a'],['struct','BOS / CHoCH','#5b8def'],['rsi','RSI','#fb923c']];

/* ---------- mock data ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=r=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(6.2832*r());
function gen(pair,tf){
  const P=PAIRS[pair],[step,n]=TFS[tf],r=rng(P.seed*1000+n+step%97),sv=P.vol*Math.sqrt(step/86400),ph=r()*6.28,bias=(r()-.5)*sv*.24;
  const now=Math.floor(Date.now()/1000/step)*step,raw=[];let p=1;
  for(let i=0;i<n;i++){const o=p,c=o*(1+Math.sin(i/n*9+ph)*sv*.25+bias+gauss(r)*sv),w=Math.abs(gauss(r))*sv*.5;
    raw.push({time:now-(n-1-i)*step,open:o,high:Math.max(o,c)*(1+w),low:Math.min(o,c)*(1-w),close:c});p=c}
  const k=P.base/p,f=v=>+(v*k).toFixed(P.d);
  return raw.map(b=>({time:b.time,open:f(b.open),high:f(b.high),low:f(b.low),close:f(b.close)}));
}

/* ---------- indicators ---------- */
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const smaOf=(d,n)=>d.map((b,i)=>i<n-1?{time:b.time}:{time:b.time,value:avg(d.slice(i-n+1,i+1).map(x=>x.close))});
function bollinger(d,n=20,k=2){const u=[],m=[],l=[];d.forEach((b,i)=>{if(i<n-1){[u,m,l].forEach(a=>a.push({time:b.time}));return}
  const w=d.slice(i-n+1,i+1).map(x=>x.close),mu=avg(w),sd=Math.sqrt(avg(w.map(x=>(x-mu)**2)));
  u.push({time:b.time,value:mu+k*sd});m.push({time:b.time,value:mu});l.push({time:b.time,value:mu-k*sd})});return{u,m,l}}
function rsiOf(d,n=14){const out=d.map(b=>({time:b.time}));let g=0,l=0;
  for(let i=1;i<d.length;i++){const ch=d[i].close-d[i-1].close,up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<=n){g+=up/n;l+=dn/n}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n}
    if(i>=n)out[i].value=l===0?100:100-100/(1+g/l)}return out}

/* ---------- charts ---------- */
const L=LightweightCharts;
const base={layout:{background:{type:'solid',color:'transparent'},textColor:'#a1a1aa',fontFamily:'Figtree, system-ui, sans-serif',fontSize:12},
  grid:{vertLines:{color:'#16161a'},horzLines:{color:'#1c1c21'}},autoSize:true,
  crosshair:{mode:0,vertLine:{color:'#71717a',style:3,labelBackgroundColor:'#3f3f46'},horzLine:{color:'#71717a',style:3,labelBackgroundColor:'#3f3f46'}},
  rightPriceScale:{borderColor:'#27272a',minimumWidth:78},timeScale:{borderColor:'#27272a',rightOffset:4}};
const mainC=L.createChart($('main'),base);
const rsiC=L.createChart($('rsi'),{...base,timeScale:{...base.timeScale,visible:false},rightPriceScale:{...base.rightPriceScale,scaleMargins:{top:.15,bottom:.15}}});
const candle=mainC.addCandlestickSeries({upColor:'#2BB673',downColor:'#E5566D',wickUpColor:'#2BB673',wickDownColor:'#E5566D',borderVisible:false});
const area=mainC.addAreaSeries({lineWidth:2,priceLineVisible:true});
const ln=(c,w=1.5)=>mainC.addLineSeries({color:c,lineWidth:w,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const e9S=ln('#d6467a'),s20=ln('#facc15'),s50=ln('#38bdf8'),bbU=ln('#c084fc',1),bbM=ln('#c084fc55',1),bbL=ln('#c084fc',1);
const rsiS=rsiC.addLineSeries({color:'#fb923c',lineWidth:2,priceLineVisible:false,priceFormat:{type:'price',precision:1,minMove:.1}});
[70,30].forEach(v=>rsiS.createPriceLine({price:v,color:'#52525b',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:''}));

let syncing=false,xs=false,data=[],closeMap=new Map(),rsiMap=new Map(),ind={};
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing||!r)return;syncing=true;b.timeScale().setVisibleLogicalRange(r);syncing=false});
link(mainC,rsiC);link(rsiC,mainC);

function activeSeries(){return state.type==='candle'?candle:area}
const fmt=v=>v==null?'–':v.toFixed(PAIRS[state.pair].d);

function setLegend(bar,t){
  if(!bar)return;const o=bar.open!=null?bar:{open:bar.close,high:bar.close,low:bar.close,close:bar.close};
  const c=o.close>=o.open?'up':'down';
  let h=`<span class="${c}">O ${fmt(o.open)} &nbsp;H ${fmt(o.high)} &nbsp;L ${fmt(o.low)} &nbsp;C ${fmt(o.close)}</span>`;
  const g=(m)=>m.get(t);
  if(state.ind.sma20)h+=` &nbsp;<span style="color:#facc15">SMA 20 ${fmt(g(ind.m20))}</span>`;
  if(state.ind.ema9)h+=` &nbsp;<span style="color:#d6467a">EMA 9 ${fmt(g(ind.e9))}</span>`;if(state.ind.sma50)h+=` &nbsp;<span style="color:#38bdf8">SMA 50 ${fmt(g(ind.m50))}</span>`;
  $('legend').innerHTML=h;
}
mainC.subscribeCrosshairMove(p=>{
  const b=p.time?data.find(x=>x.time===p.time):data[data.length-1];setLegend(b,p.time||b.time);
  if(xs||!state.ind.rsi)return;xs=true;
  const v=p.time&&rsiMap.get(p.time);v!=null?rsiC.setCrosshairPosition(v,p.time,rsiS):rsiC.clearCrosshairPosition();
  $('rsiVal').textContent=v!=null?v.toFixed(1):'';xs=false});
rsiC.subscribeCrosshairMove(p=>{
  if(xs)return;xs=true;
  const v=p.time&&closeMap.get(p.time);v!=null?mainC.setCrosshairPosition(v,p.time,activeSeries()):mainC.clearCrosshairPosition();
  $('rsiVal').textContent=p.time&&rsiMap.get(p.time)!=null?rsiMap.get(p.time).toFixed(1):'';xs=false});

/* ---------- live data ---------- */
const BIN={'EUR/USD':'EURUSDT','GBP/USD':'GBPUSDT','XAU/USD':'PAXGUSDT'};
const BI={'5min':'5m','1H':'1h','5H':'1h','1D':'15m','1W':'1h','1M':'4h','3M':'1d','1Y':'1d'};
const AVI={'5min':'5min','1H':'60min','5H':'60min','1D':'15min','1W':'60min'},AVN={'5min':144,'1H':120,'5H':120,'1D':96,'1W':168,'1M':60,'3M':90,'1Y':365};
const cache=new Map();let seq=0;
let lastRaw=null,rawH=null;
const agg=(b,s)=>{const m=new Map();b.forEach(x=>{const t=Math.floor(x.time/s)*s,c=m.get(t);c?(c.high=Math.max(c.high,x.high),c.low=Math.min(c.low,x.low),c.close=x.close):m.set(t,{time:t,open:x.open,high:x.high,low:x.low,close:x.close})});return[...m.values()].sort((a,b)=>a.time-b.time)};
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function binance(pair,tf){
  const q=`/api/v3/klines?symbol=${BIN[pair]}&interval=${BI[tf]}&limit=${tf==='5H'?TFS[tf][1]*5+4:TFS[tf][1]}`;let j;
  try{j=await getJSON('https://data-api.binance.vision'+q)}catch(e){j=await getJSON('https://api.binance.com'+q)}
  const hb=j.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));lastRaw=tf==='5H'?hb:null;return tf==='5H'?agg(hb,18000).slice(-TFS[tf][1]):hb;
}
async function alpha(pair,tf,key){
  const [f,t]=pair.split('/'),iv=AVI[tf];
  const j=await getJSON(`https://www.alphavantage.co/query?function=${iv?'FX_INTRADAY':'FX_DAILY'}&from_symbol=${f}&to_symbol=${t}${iv?'&interval='+iv:''}&outputsize=full&apikey=${encodeURIComponent(key)}`);
  const k=Object.keys(j).find(x=>x.startsWith('Time Series'));

  const d=(draws[key()]||[])[+i],v=parseFloat(e.target.value);if(d&&isFinite(v))d.p1.price=d.p2.price=v;e.target.blur();analyzeDraws()});


/* ---------- v3: tabs, structure, sessions, auto lines, market analysis, 6-month history ---------- */
const UNIT={'EUR/USD':'USD per EUR','GBP/USD':'USD per GBP','USD/JPY':'JPY per USD','XAU/USD':'USD per troy oz'};
const PIP={'EUR/USD':.0001,'GBP/USD':.0001,'USD/JPY':.01,'XAU/USD':.1}; // change XAU to .01 if your broker uses 0.01
const SESS=[['Asia',0,9,'#7c8cf5'],['London',7,16,'#e9a14a'],['New York',12,21,'#4fb8a8']]; // UTC, shifts with daylight saving
const tk={};let autoL=[],sessL=[],evs=[],trS=0,lastV='',lastSc=0,snap=null,older=false,lastHr='',lastEv={},notif=false,mlog={};
try{mlog=JSON.parse(localStorage.getItem('fxlog'))||{}}catch(e){}
async function pollTabs(){
  try{const j=await getJSON('https://data-api.binance.vision/api/v3/ticker/24hr?symbols=['+Object.values(BIN).map(x=>`"${x}"`).join(',')+']');
    j.forEach(x=>{const p=Object.keys(BIN).find(k=>BIN[k]===x.symbol);tk[p]={p:+x.lastPrice,chg:+x.priceChange,pct:+x.priceChangePercent}})}catch(e){}
  drawTabs()}
function drawTabs(){
  $('pairTabs').innerHTML=Object.keys(PAIRS).map(p=>{const t=tk[p],up=t&&t.chg>=0;
    return `<button data-pair="${p}" class="tab ${p===state.pair?'on':''}"><b>${p}</b><i>${UNIT[p]}</i><span>${t?t.p.toFixed(PAIRS[p].d):'–'}</span>${t?`<span class="${up?'up':'down'}">${up?'▲':'▼'} ${(Math.abs(t.chg)/PIP[p]).toFixed(1)} pips · ${up?'+':''}${t.pct.toFixed(2)}%</span>`:'<span>–</span>'}</button>`}).join('')}
function swings(d,k=3){const H=[],L=[];for(let i=k;i<d.length-k;i++){let h=1,l=1;for(let j=1;j<=k;j++){if(d[i].high<=d[i-j].high||d[i].high<=d[i+j].high)h=0;if(d[i].low>=d[i-j].low||d[i].low>=d[i+j].low)l=0}
  if(h)H.push({i,time:d[i].time,price:d[i].high});if(l)L.push({i,time:d[i].time,price:d[i].low})}return{H,L}}
function autoLines(d){const{H,L}=swings(d),out=[];
  const pick=(a,up)=>{const s=a.slice(-3);for(let y=s.length-1;y>0;y--)for(let x=y-1;x>=0;x--){const p=s[x],q=s[y];if(up?q.price<=p.price:q.price>=p.price)continue;
    const m=(q.price-p.price)/(q.i-p.i);let ok=1;for(let i=p.i+1;i<q.i;i++){const v=p.price+m*(i-p.i);if(up?d[i].close<v:d[i].close>v){ok=0;break}}if(ok)return{p1:p,p2:q}}return null};
  [pick(L,true),pick(H,false)].forEach(l=>l&&out.push({p1:{time:l.p1.time,price:l.p1.price},p2:{time:l.p2.time,price:l.p2.price}}));return out}
function sessions(d){if(TFS[state.tf][0]>=86400)return[];const last=d[d.length-1].time,day=Math.floor(last/86400)*86400,out=[];
  SESS.forEach(([n,a,b,c])=>{let got=0;for(let o=0;o>-4&&got<2;o--){const s=day+o*86400+a*3600,e=day+o*86400+b*3600;if(s>last)continue;
    const w=d.filter(x=>x.time>=s&&x.time<e);if(!w.length)continue;got++;out.push({n,c,hi:Math.max(...w.map(x=>x.high)),lo:Math.min(...w.map(x=>x.low)),t1:w[0].time,t2:w[w.length-1].time})}});return out}
function structure(d,k=3){const{H,L}=swings(d,k),hm=new Map(H.map(s=>[s.i,s])),lm=new Map(L.map(s=>[s.i,s])),ev=[];let tr=0,lh=null,ll=null;
  for(let i=0;i<d.length;i++){const a=hm.get(i-k),b=lm.get(i-k);if(a)lh={...a,done:0};if(b)ll={...b,done:0};const c=d[i].close;
    if(lh&&!lh.done&&c>lh.price){lh.done=1;ev.push({type:tr<0?'CHoCH':tr>0?'BOS':'',dir:1,t1:lh.time,t2:d[i].time,price:lh.price});tr=1}
    else if(ll&&!ll.done&&c<ll.price){ll.done=1;ev.push({type:tr>0?'CHoCH':tr<0?'BOS':'',dir:-1,t1:ll.time,t2:d[i].time,price:ll.price});tr=-1}}
  return{ev:ev.filter(e=>e.type),tr}}
function drawExtra(ts,se,pw){
  const X=t=>ts.timeToCoordinate(t),Y=p=>se.priceToCoordinate(p),seg=(x1,y1,x2,y2,c,txt,dash)=>{cx.strokeStyle=cx.fillStyle=c;cx.lineWidth=1;cx.setLineDash(dash||[]);line(x1,y1,x2,y2);cx.setLineDash([]);if(txt)cx.fillText(txt,x1+4,y1-4)};
  cx.font='11px Figtree, sans-serif';
  if(state.ind.auto)autoL.forEach(d=>{const x1=X(d.p1.time),x2=X(d.p2.time),y1=Y(d.p1.price),y2=Y(d.p2.price);if(x1==null||x2==null||y1==null||y2==null||x1===x2)return;const ex=Math.max(pw,x2);seg(x1,y1,ex,y2+(y2-y1)*(ex-x2)/(x2-x1),'#8b8fa8','Auto',[3,4])});
  if(state.ind.sess)sessL.forEach(s=>{const x1=X(s.t1),x2=X(s.t2),yh=Y(s.hi),yl=Y(s.lo);if(x1==null||x2==null)return;if(yh!=null)seg(x1,yh,x2,yh,s.c,s.n+' H '+fmt(s.hi));if(yl!=null)seg(x1,yl,x2,yl,s.c,s.n+' L '+fmt(s.lo))});
  if(state.ind.struct)evs.slice(-6).forEach(e=>{const x1=X(e.t1),x2=X(e.t2),y=Y(e.price);if(x1==null||x2==null||y==null)return;const c=e.dir>0?'#2BB673':'#E5566D';seg(x1,y,x2,y,c,null,[5,3]);cx.fillStyle=c;cx.fillText(e.type,(x1+x2)/2-12,e.dir>0?y-5:y+13)})}
const curSess=()=>{const h=new Date().getUTCHours(),n=SESS.filter(s=>h>=s[1]&&h<s[2]).map(s=>s[0]);return n.length?n.join(' + '):'Off-hours'};
function mktRender(){
  if(!snap)return;const e=evs[evs.length-1];
  $('mktBody').innerHTML=`<p class="text-sm leading-relaxed">${state.pair}: <b>${lastV}</b> (score ${lastSc.toFixed(1)}). Structure is <b>${trS>0?'bullish':trS<0?'bearish':'unclear'}</b>. ${e?`Last ${e.type}: ${e.dir>0?'bullish':'bearish'} close beyond ${fmt(e.price)} at ${new Date(e.t2*1000).toUTCString().slice(17,22)} UTC.`:'No BOS or CHoCH in view.'} Nearest support ${fmt(lv.S[0])}, resistance ${fmt(lv.R[0])}. Session: ${curSess()}. RSI ${snap.r.toFixed(0)}; price is ${snap.px>snap.e9?'above':'below'} EMA 9.</p>
   <label class="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" id="ntf" ${notif?'checked':''}> Notify me hourly</label>
   <h3 class="mt-4 text-sm text-zinc-400">Hourly log (${state.pair})</h3><ul>${(mlog[state.pair]||[]).map(t=>`<li class="border-b py-2 text-sm" style="border-color:var(--line)">${t}</li>`).join('')||'<li class="py-2 text-sm text-zinc-400">The next entry is added at the top of the hour.</li>'}</ul>`;
  $('ntf').onchange=async e=>{notif=e.target.checked;if(notif&&window.Notification&&Notification.permission==='default')await Notification.requestPermission()}}
function addLog(){
  if(!snap)return;const p=state.pair,e=evs[evs.length-1],k=e?e.type+e.t2:'',hh=String(new Date().getHours()).padStart(2,'0');
  const ph=!e?'No BOS or CHoCH in view':k!==lastEv[p]?`New ${e.dir>0?'bullish':'bearish'} ${e.type} ${e.dir>0?'above':'below'} ${fmt(e.price)}`:`No new structure break (last: ${e.dir>0?'bullish':'bearish'} ${e.type} at ${fmt(e.price)})`;
  lastEv[p]=k;const txt=`${hh}:00 ${p}: ${ph}. RSI ${snap.r.toFixed(0)}. Price ${snap.px>snap.e9?'above':'below'} EMA 9. Verdict ${lastV}.`;
  mlog[p]=[txt].concat(mlog[p]||[]).slice(0,24);try{localStorage.setItem('fxlog',JSON.stringify(mlog))}catch(x){}
  if(notif&&window.Notification&&Notification.permission==='granted')new Notification('FX Lens',{body:txt});mktRender()}
mainC.timeScale().subscribeVisibleLogicalRangeChange(async r=>{
  if(!r||r.from>15||older||!data.length||!BIN[state.pair]||state.tf==='5H'||data.length>=5000||data[0].time<Date.now()/1000-183*86400)return;
  older=true;const my=seq;
  try{const q=`/api/v3/klines?symbol=${BIN[state.pair]}&interval=${BI[state.tf]}&limit=1000&endTime=${data[0].time*1000-1}`;let j;
    try{j=await getJSON('https://data-api.binance.vision'+q)}catch(e){j=await getJSON('https://api.binance.com'+q)}
    if(my!==seq||!j.length)return;const cut=Date.now()/1000-183*86400;
    const add=j.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]})).filter(b=>b.time>=cut&&b.time<data[0].time);
    if(!add.length)return;const vr=mainC.timeScale().getVisibleLogicalRange();data=add.concat(data);
    const c=cache.get([state.pair,state.tf,true].join('|'));if(c)c.bars=data;
    paint(true);if(vr)mainC.timeScale().setVisibleLogicalRange({from:vr.from+add.length,to:vr.to+add.length})}
  catch(e){}finally{older=false}});

/* ---------- render ---------- */
function paint(keep){
  const P=PAIRS[state.pair],pf={type:'price',precision:P.d,minMove:1/10**P.d};
  const first=data[0],last=data[data.length-1],chg=(last.close/first.open-1)*100,upT=chg>=0,col=upT?'#2BB673':'#E5566D';
  const s2=smaOf(data,20),s5=smaOf(data,50),bb=bollinger(data),rs=rsiOf(data),e9d=emaOf(data,9);
  const m=a=>new Map(a.filter(x=>x.value!=null).map(x=>[x.time,x.value]));
  ind={m20:m(s2),m50:m(s5),e9:m(e9d)};closeMap=new Map(data.map(b=>[b.time,b.close]));rsiMap=m(rs);
  [candle,area,e9S,s20,s50,bbU,bbM,bbL].forEach(s=>s.applyOptions({priceFormat:pf}));
  candle.setData(data);
  area.setData(data.map(b=>({time:b.time,value:b.close})));
  area.applyOptions({lineColor:col,topColor:col+'40',bottomColor:col+'00'});
  s20.setData(s2);s50.setData(s5);e9S.setData(e9d);bbU.setData(bb.u);bbM.setData(bb.m);bbL.setData(bb.l);rsiS.setData(rs);
  const I=state.ind;
  candle.applyOptions({visible:state.type==='candle'});area.applyOptions({visible:state.type==='line'});
  s20.applyOptions({visible:!!I.sma20});e9S.applyOptions({visible:!!I.ema9});s50.applyOptions({visible:!!I.sma50});
  [bbU,bbM,bbL].forEach(s=>s.applyOptions({visible:!!I.bb}));
  $('rsiWrap').classList.toggle('hidden',!I.rsi);
  const intraday=TFS[state.tf][0]<86400;
  mainC.applyOptions({timeScale:{timeVisible:intraday,secondsVisible:false}});
  if(!keep)requestAnimationFrame(()=>{mainC.timeScale().fitContent();const r=mainC.timeScale().getVisibleLogicalRange();if(r)rsiC.timeScale().setVisibleLogicalRange(r)});
  setLegend(last,last.time);
  // header
  $('pairName').textContent=state.pair;$('price').textContent=fmt(last.close);
  const el=$('chg');el.className='text-sm font-medium '+(upT?'up':'down');
  el.textContent=`${upT?'+':''}${(last.close-first.open).toFixed(P.d)} (${upT?'+':''}${chg.toFixed(2)}%) · ${TFS[state.tf][2]}`;
  lv=sr(data);drawSR();insights(data,s2,s5,bb,rs,chg);runAIEngine(data,s2,s5,bb,rs);analyzeDraws();
  autoL=autoLines(data);sessL=sessions(data);{const st=structure(data);evs=st.ev;trS=st.tr}snap={r:rs[rs.length-1].value,e9:e9d[e9d.length-1].value,px:last.close};
  if(!BIN[state.pair]){const ref=data.find(b=>b.time>=last.time-86400)||data[0];tk[state.pair]={p:last.close,chg:last.close-ref.open,pct:(last.close/ref.open-1)*100}}
  if(!$('mkt').classList.contains('hidden'))mktRender();
  drawControls();
}

function insights(d,s2,s5,bb,rs,chg){
  const last=d[d.length-1],v20=s2.at(-1).value,v50=s5.at(-1).value,slope=s5.at(-1).value-s5.at(-11).value;
  const bw=bb.u.map((x,i)=>x.value!=null?(x.value-bb.l[i].value)/bb.m[i].value:null).filter(x=>x!=null);
  const pct=bw.filter(x=>x<=bw.at(-1)).length/bw.length;
  const bull=last.close>v50&&v20>v50&&slope>0,bear=last.close<v50&&v20<v50&&slope<0;
  const dir=bull?'Bullish':bear?'Bearish':'Neutral',st=pct<.35?'consolidation':'trend';
  const label=dir==='Neutral'?'Range-bound':`${dir} ${st}`;
  const r=rs.at(-1).value,rr=r>70?'Overbought':r<30?'Oversold':r>55?'Leaning strong':r<45?'Leaning weak':'Balanced';
  const w=d.slice(-30),hi=Math.max(...w.map(b=>b.high)),lo=Math.min(...w.map(b=>b.low));
  const atr=avg(d.slice(-14).map(b=>(b.high-b.low)/b.close*100));
  $('trend').innerHTML=`<span class="${bull?'up':bear?'down':''}">${label}</span>`;
  $('summary').textContent=`Price is ${last.close>v50?'above':'below'} its 50-period average and the 20-period average is ${v20>v50?'above':'below'} it. Bollinger band width is in the ${Math.round(pct*100)}th percentile of this window, so volatility is ${pct<.35?'compressed':pct>.7?'expanded':'moderate'}.`;
  const row=(k,v,c='')=>`<div class="flex justify-between py-2"><dt class="text-zinc-400">${k}</dt><dd class="font-medium ${c}">${v}</dd></div>`;
  $('stats').innerHTML=row(TFS[state.tf][2]+' change',`${chg>=0?'+':''}${chg.toFixed(2)}%`,chg>=0?'up':'down')
    +row('RSI (14)',`${r.toFixed(1)} · ${rr}`,r>70?'down':r<30?'up':'')
    +row('Nearest support',fmt(lv.S[0]))+row('Nearest resistance',fmt(lv.R[0]))
    +row('Range high',fmt(Math.max(...d.map(b=>b.high))))+row('Range low',fmt(Math.min(...d.map(b=>b.low))))
    +row('Average bar range',atr.toFixed(2)+'%');
}

/* ---------- controls ---------- */
function drawControls(){drawBar();syncInd();
  drawTabs();
  $('tfs').innerHTML=Object.keys(TFS).map(t=>`<button class="chip ${t===state.tf?'on':''}" data-tf="${t}">${t}</button>`).join('');
  $('tools').innerHTML=TOOLS.map(t=>{
    if(t==='|')return'';
    const [k,n,c]=t,isType=k==='candle'||k==='line',on=isType?state.type===k:state.ind[k];
    return isType?`<button class="chip ${on?'on':''}" data-type="${k}">${n}</button>`
      :''}).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.pair){state.pair=d.pair;sel=null}else if(d.tf){state.tf=d.tf;sel=null}else if(d.type)state.type=d.type;else if(d.ind)state.ind[d.ind]^=1;else if(d.tool){tool=tool===d.tool?null:d.tool;first=null;drawBar();return}else if(d.act){if(d.act==='undo')(draws[key()]||[]).pop();else if(d.act==='delsel'){const L=draws[key()]||[];if(L[sel])L.splice(sel,1);sel=null}else if(d.act==='clearall'){if(Object.values(draws).some(l=>l.length)&&!confirm('Remove all drawings on every pair and timeframe, and reset the chart view?'))return;for(const k in draws)delete draws[k];tool=null;first=null;sel=null;drag=null;drawBar();mainC.priceScale('right').applyOptions({autoScale:true});mainC.timeScale().fitContent()}else draws[key()]=[];analyzeDraws();return}else if(d.del!==undefined){(draws[key()]||[]).splice(+d.del,1);sel=null;analyzeDraws();return}else if(d.selx!==undefined){sel=+d.selx;analyzeDraws();return}else return;
  load();
});
