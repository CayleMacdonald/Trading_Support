<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forex tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--up:#00ff85;--down:#ff2d55;--bg:#09090b;--panel:#111114;--line:#27272a;--mut:#a1a1aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:#e4e4e7;font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chip{padding:.3rem .8rem;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap;background:transparent;transition:background .15s,color .15s}
.chip:hover{color:#fff;border-color:#3f3f46}
.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chip.on{background:#fafafa;color:#09090b;border-color:#fafafa}
.pill{display:inline-flex;align-items:center;gap:.45rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);opacity:.35}
.pill.on{color:#fff;border-color:var(--c);background:#18181b}
.pill.on i{opacity:1}
.up{color:var(--up)}.down{color:var(--down)}
.scroll-x{overflow-x:auto;scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
#main.cr,#main.cr *{cursor:crosshair!important}#main.mv,#main.mv *{cursor:move!important}
</style></head>
<body>
<div class="flex flex-col h-full">
  <header class="px-4 pt-3 pb-2 border-b border-zinc-800">
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
      <div>
        <div class="text-sm text-zinc-400" id="pairName">EUR/USD</div>
        <div class="flex items-baseline gap-3">
          <span class="text-3xl font-semibold tracking-tight" id="price">–</span>
          <span class="text-sm font-medium" id="chg">–</span>
        </div>
      </div>
      <select id="pairSel" aria-label="Currency pair" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm font-medium text-zinc-100" style="color-scheme:dark"></select>
    </div>
  <div class="flex flex-wrap items-center gap-3 mt-2 text-xs">
      <input id="key" type="password" autocomplete="off" placeholder="Alpha Vantage key (needed for USD/JPY)" class="bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 w-64 text-zinc-200 placeholder-zinc-500">
      <button id="refresh" class="chip" title="Fetch the latest data now">Refresh</button>
      <span id="status" class="text-zinc-400">Loading…</span>
    </div>
  </header>

  <div class="flex-1 min-h-0 flex flex-col lg:flex-row overflow-y-auto lg:overflow-visible">
    <section class="h-[64dvh] lg:h-auto lg:flex-1 shrink-0 lg:shrink flex flex-col min-w-0 min-h-0">
      <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2">
        <div class="flex gap-1.5" id="tfs" aria-label="Timeframe"></div>
        <div class="scroll-x flex gap-1.5 max-w-full" id="tools"></div>
      </div>
      <div id="draw" class="flex flex-wrap items-center gap-1.5 px-4 pb-2"></div>
      <div class="relative flex-1 min-h-0">
        <div id="legend" class="absolute left-4 top-1 z-10 text-xs text-zinc-400 pointer-events-none"></div>
        <div id="main" class="absolute inset-0"></div>
        <canvas id="ov" style="position:absolute;left:0;top:0;pointer-events:none;z-index:5"></canvas>
      </div>
      <div id="rsiWrap" class="hidden h-28 border-t border-zinc-800 relative">
        <div class="absolute left-4 top-1 z-10 text-xs text-zinc-400 pointer-events-none">RSI 14 <span id="rsiVal" class="text-zinc-200"></span></div>
        <div id="rsi" class="absolute inset-0"></div>
      </div>
    </section>

    <aside class="lg:w-[22rem] shrink-0 border-t lg:border-t-0 lg:border-l border-zinc-800 p-4 lg:overflow-y-auto" style="background:var(--panel)">
      <div id="ai" class="pb-4 mb-4 border-b border-zinc-800"></div>
      <div id="drawAI" class="hidden pb-4 mb-4 border-b border-zinc-800"></div>
      <h2 class="text-sm text-zinc-400">Trend insights</h2>
      <div class="mt-2 text-2xl font-semibold leading-tight" id="trend">–</div>
      <p class="mt-2 text-sm text-zinc-400 leading-relaxed" id="summary"></p>
      <dl class="mt-4 divide-y divide-zinc-800 text-sm" id="stats"></dl>
      <p class="mt-4 text-xs text-zinc-500">EUR/USD, GBP/USD and gold come from Binance (stablecoin-quoted, close to spot). USD/JPY comes from Alpha Vantage. Not financial advice.</p>
    </aside>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
if(!window.LightweightCharts){document.body.insertAdjacentHTML('afterbegin','<p style="padding:1rem;color:#ff2d55">The charting library failed to load. Check your connection and reload.</p>');throw new Error('lightweight-charts missing')}
const PAIRS={'EUR/USD':{base:1.0862,d:5,vol:.005,seed:11},'USD/JPY':{base:149.35,d:3,vol:.006,seed:23},'GBP/USD':{base:1.2946,d:5,vol:.0055,seed:37},'XAU/USD':{base:2648.4,d:2,vol:.01,seed:51}};
const TFS={'1D':[900,96,'1 day'],'1W':[3600,168,'1 week'],'1M':[14400,180,'1 month'],'3M':[86400,90,'3 months'],'1Y':[86400,365,'1 year']};
const state={pair:'EUR/USD',tf:'1M',type:'candle',ind:{sma20:1,sma50:1,bb:0,sr:1,rsi:1}};
const TOOLS=[['candle','Candles'],['line','Line'],'|',['sma20','SMA 20','#facc15'],['sma50','SMA 50','#38bdf8'],['bb','Bollinger bands','#c084fc'],['sr','Support & resistance','#94a3b8'],['rsi','RSI','#fb923c']];

/* ---------- mock data ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=r=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(6.2832*r());
function gen(pair,tf){
  const P=PAIRS[pair],[step,n]=TFS[tf],r=rng(P.seed*1000+n+step%97),sv=P.vol*Math.sqrt(step/86400),ph=r()*6.28,bias=(r()-.5)*sv*.24;
  const now=Math.floor(Date.now()/1000/step)*step,raw=[];let p=1;
  for(let i=0;i<n;i++){const o=p,c=o*(1+Math.sin(i/n*9+ph)*sv*.25+bias+gauss(r)*sv),w=Math.abs(gauss(r))*sv*.5;
    raw.push({time:now-(n-1-i)*step,open:o,high:Math.max(o,c)*(1+w),low:Math.min(o,c)*(1-w),close:c});p=c}
  const k=P.base/p,f=v=>+(v*k).toFixed(P.d);
  return raw.map(b=>({time:b.time,open:f(b.open),high:f(b.high),low:f(b.low),close:f(b.close)}));
}

/* ---------- indicators ---------- */
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const smaOf=(d,n)=>d.map((b,i)=>i<n-1?{time:b.time}:{time:b.time,value:avg(d.slice(i-n+1,i+1).map(x=>x.close))});
function bollinger(d,n=20,k=2){const u=[],m=[],l=[];d.forEach((b,i)=>{if(i<n-1){[u,m,l].forEach(a=>a.push({time:b.time}));return}
  const w=d.slice(i-n+1,i+1).map(x=>x.close),mu=avg(w),sd=Math.sqrt(avg(w.map(x=>(x-mu)**2)));
  u.push({time:b.time,value:mu+k*sd});m.push({time:b.time,value:mu});l.push({time:b.time,value:mu-k*sd})});return{u,m,l}}
function rsiOf(d,n=14){const out=d.map(b=>({time:b.time}));let g=0,l=0;
  for(let i=1;i<d.length;i++){const ch=d[i].close-d[i-1].close,up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<=n){g+=up/n;l+=dn/n}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n}
    if(i>=n)out[i].value=l===0?100:100-100/(1+g/l)}return out}

/* ---------- charts ---------- */
const L=LightweightCharts;
const base={layout:{background:{type:'solid',color:'transparent'},textColor:'#a1a1aa',fontFamily:'Figtree, system-ui, sans-serif',fontSize:12},
  grid:{vertLines:{color:'#16161a'},horzLines:{color:'#1c1c21'}},autoSize:true,
  crosshair:{mode:0,vertLine:{color:'#71717a',style:3,labelBackgroundColor:'#3f3f46'},horzLine:{color:'#71717a',style:3,labelBackgroundColor:'#3f3f46'}},
  rightPriceScale:{borderColor:'#27272a',minimumWidth:78},timeScale:{borderColor:'#27272a',rightOffset:4}};
const mainC=L.createChart($('main'),base);
const rsiC=L.createChart($('rsi'),{...base,timeScale:{...base.timeScale,visible:false},rightPriceScale:{...base.rightPriceScale,scaleMargins:{top:.15,bottom:.15}}});
const candle=mainC.addCandlestickSeries({upColor:'#00ff85',downColor:'#ff2d55',wickUpColor:'#00ff85',wickDownColor:'#ff2d55',borderVisible:false});
const area=mainC.addAreaSeries({lineWidth:2,priceLineVisible:true});
const ln=(c,w=1.5)=>mainC.addLineSeries({color:c,lineWidth:w,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const s20=ln('#facc15'),s50=ln('#38bdf8'),bbU=ln('#c084fc',1),bbM=ln('#c084fc55',1),bbL=ln('#c084fc',1);
const rsiS=rsiC.addLineSeries({color:'#fb923c',lineWidth:2,priceLineVisible:false,priceFormat:{type:'price',precision:1,minMove:.1}});
[70,30].forEach(v=>rsiS.createPriceLine({price:v,color:'#52525b',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:''}));

let syncing=false,xs=false,data=[],closeMap=new Map(),rsiMap=new Map(),ind={};
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing||!r)return;syncing=true;b.timeScale().setVisibleLogicalRange(r);syncing=false});
link(mainC,rsiC);link(rsiC,mainC);

function activeSeries(){return state.type==='candle'?candle:area}
const fmt=v=>v==null?'–':v.toFixed(PAIRS[state.pair].d);

function setLegend(bar,t){
  if(!bar)return;const o=bar.open!=null?bar:{open:bar.close,high:bar.close,low:bar.close,close:bar.close};
  const c=o.close>=o.open?'up':'down';
  let h=`<span class="${c}">O ${fmt(o.open)} &nbsp;H ${fmt(o.high)} &nbsp;L ${fmt(o.low)} &nbsp;C ${fmt(o.close)}</span>`;
  const g=(m)=>m.get(t);
  if(state.ind.sma20)h+=` &nbsp;<span style="color:#facc15">SMA 20 ${fmt(g(ind.m20))}</span>`;
  if(state.ind.sma50)h+=` &nbsp;<span style="color:#38bdf8">SMA 50 ${fmt(g(ind.m50))}</span>`;
  $('legend').innerHTML=h;
}
mainC.subscribeCrosshairMove(p=>{
  const b=p.time?data.find(x=>x.time===p.time):data[data.length-1];setLegend(b,p.time||b.time);
  if(xs||!state.ind.rsi)return;xs=true;
  const v=p.time&&rsiMap.get(p.time);v!=null?rsiC.setCrosshairPosition(v,p.time,rsiS):rsiC.clearCrosshairPosition();
  $('rsiVal').textContent=v!=null?v.toFixed(1):'';xs=false});
rsiC.subscribeCrosshairMove(p=>{
  if(xs)return;xs=true;
  const v=p.time&&closeMap.get(p.time);v!=null?mainC.setCrosshairPosition(v,p.time,activeSeries()):mainC.clearCrosshairPosition();
  $('rsiVal').textContent=p.time&&rsiMap.get(p.time)!=null?rsiMap.get(p.time).toFixed(1):'';xs=false});

/* ---------- live data ---------- */
const BIN={'EUR/USD':'EURUSDT','GBP/USD':'GBPUSDT','XAU/USD':'PAXGUSDT'};
const BI={'1D':'15m','1W':'1h','1M':'4h','3M':'1d','1Y':'1d'};
const AVI={'1D':'15min','1W':'60min'},AVN={'1D':96,'1W':168,'1M':60,'3M':90,'1Y':365};
const cache=new Map();let seq=0;
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function binance(pair,tf){
  const q=`/api/v3/klines?symbol=${BIN[pair]}&interval=${BI[tf]}&limit=${TFS[tf][1]}`;let j;
  try{j=await getJSON('https://data-api.binance.vision'+q)}catch(e){j=await getJSON('https://api.binance.com'+q)}
  return j.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
}
async function alpha(pair,tf,key){
  const [f,t]=pair.split('/'),iv=AVI[tf];
  const j=await getJSON(`https://www.alphavantage.co/query?function=${iv?'FX_INTRADAY':'FX_DAILY'}&from_symbol=${f}&to_symbol=${t}${iv?'&interval='+iv:''}&outputsize=full&apikey=${encodeURIComponent(key)}`);
  const k=Object.keys(j).find(x=>x.startsWith('Time Series'));
  if(!k)throw new Error(j.Note||j.Information||j['Error Message']||'No data returned');
  return Object.entries(j[k]).map(([d,v])=>({time:Date.parse(d.replace(' ','T')+'Z')/1000,open:+v['1. open'],high:+v['2. high'],low:+v['3. low'],close:+v['4. close']})).sort((a,b)=>a.time-b.time).slice(-AVN[tf]);
}
async function fetchBars(pair,tf){
  const key=$('key').value.trim(),bin=!!BIN[pair],id=[pair,tf,bin].join('|'),c=cache.get(id);
  if(c&&Date.now()-c.t<(bin?15000:300000))return c;
  if(!bin&&!key)throw new Error(pair+' needs a free Alpha Vantage key. Paste it above.');
  const bars=bin?await binance(pair,tf):await alpha(pair,tf,key);
  if(bars.length<50)throw new Error('Not enough bars returned');
  const r={bars,src:bin?'Binance':'Alpha Vantage',t:Date.now()};cache.set(id,r);return r;
}
async function load(keep){
  const my=++seq,st=$('status');
  try{const r=await fetchBars(state.pair,state.tf);if(my!==seq)return;
    data=r.bars;st.style.color='var(--up)';const bn=r.src==='Binance';st.textContent=(bn?'Live · ':'Delayed · ')+r.src+' · '+new Date(r.t).toLocaleTimeString()+(bn?'':' · press Refresh for the latest');sync(bn);if(bn&&ws&&ws.readyState===1)live('● Streaming · Binance · real time','var(--up)')}
  catch(e){if(my!==seq)return;data=gen(state.pair,state.tf);keep=false;unsub();
    st.textContent='Showing simulated data · '+e.message;st.style.color='var(--down)'}
  paint(keep);
}


/* ---------- support/resistance + AI analyst ---------- */
let lv={R:[0],S:[0]},srl=[];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function sr(d){
  const k=4,px=d[d.length-1].close,tol=avg(d.slice(-14).map(b=>b.high-b.low))*.8,pv=[];
  for(let i=k;i<d.length-k;i++){const w=d.slice(i-k,i+k+1);
    if(d[i].high>=Math.max(...w.map(b=>b.high)))pv.push(d[i].high);
    if(d[i].low<=Math.min(...w.map(b=>b.low)))pv.push(d[i].low)}
  pv.sort((a,b)=>a-b);const cl=[];
  pv.forEach(v=>{const c=cl[cl.length-1];if(c&&v-c.max<=tol){c.max=v;c.n++;c.sum+=v}else cl.push({sum:v,n:1,max:v})});
  const cs=cl.map(c=>c.sum/c.n),R=cs.filter(p=>p>px*1.0005).sort((a,b)=>a-b).slice(0,2),S=cs.filter(p=>p<px*.9995).sort((a,b)=>b-a).slice(0,2);
  if(!R.length)R.push(Math.max(...d.map(b=>b.high)));
  if(!S.length)S.push(Math.min(...d.map(b=>b.low)));
  return{R,S}}
function drawSR(){
  srl.forEach(([s,l])=>s.removePriceLine(l));srl=[];if(!state.ind.sr)return;
  const add=(v,c,t)=>[candle,area].forEach(s=>srl.push([s,s.createPriceLine({price:v,color:c,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:t})]));
  lv.R.forEach((v,i)=>add(v,'#ff2d55','R'+(i+1)));lv.S.forEach((v,i)=>add(v,'#00ff85','S'+(i+1)))}
const emaOf=(d,n)=>{const k=2/(n+1);let e=0;return d.map((b,i)=>{e=i?b.close*k+e*(1-k):b.close;return i<n-1?{time:b.time}:{time:b.time,value:e}})};
function runAIEngine(d,s2,s5,bb,rs){
  const N=d.length,px=d[N-1].close,v20=s2.at(-1).value,v50=s5.at(-1).value,slope=v50-s5.at(-11).value,r=rs.at(-1).value;
  const e9=emaOf(d,9),m21=smaOf(d,21),W=5;
  // most recent 9 EMA / 21 SMA cross inside the last W bars (bars ago, -1 = none)
  let bull=-1,bear=-1;
  for(let i=N-1;i>=Math.max(21,N-W);i--){const a=e9[i].value,b=m21[i].value,pa=e9[i-1].value,pb=m21[i-1].value;
    if(bull<0&&pa<=pb&&a>b)bull=N-1-i;if(bear<0&&pa>=pb&&a<b)bear=N-1-i}
  // Bollinger band touch on the last two bars
  let lowB=false,upB=false;
  for(let i=N-2;i<N;i++){if(d[i].low<=bb.l[i].value)lowB=true;if(d[i].high>=bb.u[i].value)upB=true}
  const lowTrig=lowB&&r<45,upTrig=upB&&r>55,buyTrig=bull>=0||lowTrig,sellTrig=bear>=0||upTrig;
  const atr=avg(d.slice(-14).map((b,i,a)=>{const pc=i?a[i-1].close:b.open;return Math.max(b.high-b.low,Math.abs(b.high-pc),Math.abs(b.low-pc))}));
  const S=lv.S[0],R=lv.R[0],nS=px-S<=atr*1.2,nR=R-px<=atr*1.2;
  const tr=(px>v20?1:-1)+(v20>v50?1:-1)+(slope>0?1:-1),mo=r<30?2:r>70?-2:(r-50)/25,kl=nS&&!nR?1:nR&&!nS?-1:0;
  const sc=tr+mo+kl+(lowB?1:upB?-1:0)+(bull>=0?2:bear>=0?-2:0);
  // bias comes from the score; a BUY/SELL is only issued when a trigger has fired
  const bias=sc>=4.5?2:sc>=1.5?1:sc<=-1.5?-1:0;let V='HOLD',dir=0;
  if(bias>0&&buyTrig){V=bias>1?'STRONG BUY':'BUY';dir=1}else if(bias<0&&sellTrig){V='SELL';dir=-1}
  const gated=bias!==0&&!dir;
  const bd={'STRONG BUY':'background:#00ff85;color:#04120a','BUY':'background:#00ff8522;color:#00ff85;box-shadow:inset 0 0 0 1.5px #00ff85','HOLD':'background:#27272a;color:#d4d4d8','SELL':'background:#ff2d55;color:#fff'}[V];
  const W3=['Bearish','Neutral','Bullish'],sg=[['Trend',tr>1?1:tr<-1?-1:0],['Momentum',mo>.5?1:mo<-.5?-1:0],
    ['Band touch',lowB?1:upB?-1:0,lowB?'Lower band':upB?'Upper band':'None'],['9/21 cross',bull>=0?1:bear>=0?-1:0,bull>=0?'Bullish':bear>=0?'Bearish':'None'],
    ['Key levels',kl],['Trigger',dir,dir>0?'Buy armed':dir<0?'Sell armed':'Waiting']];
  const when=n=>n===0?'on the latest bar':n+' bar'+(n>1?'s':'')+' ago';
  let b1;
  if(dir>0)b1=cap([bull>=0&&`the 9 EMA crossed above the 21 SMA ${when(bull)}`,lowTrig&&`price touched the lower Bollinger band with RSI at ${r.toFixed(0)}`].filter(Boolean).join(' and '))+'.';
  else if(dir<0)b1=cap([bear>=0&&`the 9 EMA crossed below the 21 SMA ${when(bear)}`,upTrig&&`price touched the upper Bollinger band with RSI at ${r.toFixed(0)}`].filter(Boolean).join(' and '))+'.';
  else if(gated)b1=`Bias is ${bias>0?'bullish':'bearish'}, but no trigger has fired: there is no fresh 9 EMA/21 SMA cross and no qualifying Bollinger band touch.`;
  else b1=`Signals conflict: RSI is ${r.toFixed(0)}, the 9 EMA is ${e9[N-1].value>m21[N-1].value?'above':'below'} the 21 SMA and price is inside the bands.`;
  const trT=tr===3?'price sits above a rising 20/50 SMA stack':tr===-3?'price sits below a falling 20/50 SMA stack':tr>0?'the trend leans up but the averages are not fully aligned':'the trend leans down but the averages are not fully aligned';
  const tail={'STRONG BUY':'most signals line up to the upside','BUY':'the balance of signals favours buying','SELL':'the balance of signals favours sellers','HOLD':gated?'so the engine is waiting for confirmation before signalling':'waiting is the cleaner option'}[V];
  let TP,SL,rr;
  if(dir){const risk=Math.min(3*atr,Math.max(atr,dir>0?px-(S-.25*atr):(R+.25*atr)-px)),tgt=dir>0?R:S;
    SL=px-dir*risk;TP=Math.abs(tgt-px)>=1.5*risk?tgt:px+dir*2*risk;rr=Math.abs(TP-px)/risk}
  const row=(k,v,c='')=>`<div class="flex justify-between py-2"><dt class="text-zinc-400">${k}</dt><dd class="font-medium ${c}">${v}</dd></div>`;
  const setup=dir?row(dir>0?'Entry (buy)':'Entry (sell)',fmt(px))+row('Take profit',fmt(TP),'up')+row('Stop loss',fmt(SL),'down')+row('Risk / reward','1 : '+rr.toFixed(1))
    :`<p class="py-2 text-zinc-400">${gated?(bias>0?'Wait for the 9 EMA to cross above the 21 SMA, or a lower-band touch with RSI under 45.':'Wait for the 9 EMA to cross below the 21 SMA, or an upper-band touch with RSI over 55.'):`No clear edge. Wait for a break above ${fmt(R)} or below ${fmt(S)}.`}</p>`;
  $('ai').innerHTML=`<h2 class="text-sm text-zinc-400">AI market analyst</h2>
   <div class="mt-2 flex items-center gap-3"><span class="rounded-lg px-4 py-2 text-xl font-bold tracking-tight" style="${bd}">${V}</span>
   <div class="text-xs text-zinc-400 leading-tight">Signal score<br><span class="text-sm font-medium text-zinc-200">${sc>0?'+':''}${sc.toFixed(1)} of 9</span></div></div>
   <div class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1 text-xs">${sg.map(([n,v,t])=>`<div class="flex justify-between"><span class="text-zinc-400">${n}</span><span class="font-medium ${v>0?'up':v<0?'down':'text-zinc-300'}">${t||W3[v+1]}</span></div>`).join('')}</div>
   <ul class="mt-3 space-y-2 text-sm text-zinc-300 leading-relaxed list-disc pl-4"><li>${b1}</li><li>${cap(trT)}, ${tail}.</li></ul>
   <h3 class="mt-4 text-sm text-zinc-400">Trade setup</h3><dl class="divide-y divide-zinc-800 text-sm">${setup}</dl>
   <p class="mt-2 text-xs text-zinc-500">Rule-based read of the chart data. Not financial advice.</p>`}


/* ---------- real-time stream (Binance WebSocket) ---------- */
let ws=null,subKey='',hi=0,pend=0;const WSH=['wss://stream.binance.com:9443','wss://data-stream.binance.vision'];
const live=(t,c)=>{const s=$('status');s.textContent=t;s.style.color=c};
function unsub(){subKey='';if(ws){ws.onclose=null;ws.close();ws=null}}
function sync(on){if(!on){unsub();return}const k=state.pair+'|'+state.tf;if(k===subKey&&ws)return;unsub();subKey=k;wsOpen(k)}
function wsOpen(k){
  const w=new WebSocket(`${WSH[hi%2]}/ws/${BIN[state.pair].toLowerCase()}@kline_${BI[state.tf]}`);ws=w;
  w.onopen=()=>live('● Streaming · Binance · real time','var(--up)');
  w.onmessage=e=>{const x=JSON.parse(e.data).k;if(x)applyBar({time:Math.floor(x.t/1000),open:+x.o,high:+x.h,low:+x.l,close:+x.c})};
  w.onclose=()=>{if(subKey!==k)return;hi++;live('Stream dropped, reconnecting… (Refresh loads the latest bars)','var(--down)');setTimeout(()=>{if(subKey===k)wsOpen(k)},2500)}}
function applyBar(b){
  const L=data[data.length-1];if(!L||b.time<L.time)return;
  if(b.time===L.time)data[data.length-1]=b;else data.push(b);
  candle.update(b);area.update({time:b.time,value:b.close});$('price').textContent=fmt(b.close);
  if(!pend)pend=setTimeout(()=>{pend=0;paint(true)},1500)}

/* ---------- drawing tools + analysis ---------- */
const PAL=['#facc15','#38bdf8','#c084fc','#fb923c'],draws={},cv=$('ov'),cx=cv.getContext('2d');
let tool=null,first=null,prev=null;const key=()=>state.pair+'|'+state.tf;
const line=(a,b,c,d)=>{cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()},dot=(x,y,r=3.5)=>{cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill()};
function drawBar(){
  const B=(k,n)=>`<button class="chip ${tool===k?'on':''}" data-tool="${k}">${n}</button>`;
  $('draw').innerHTML='<span class="text-xs text-zinc-500 mr-1">Draw</span>'+B('trend','Trend line')+B('hline','Horizontal line')+'<button class="chip" data-act="undo">Undo</button><button class="chip" data-act="clear" title="Remove the lines on this pair and timeframe">Clear</button><button class="chip" data-act="clearall" title="Remove every drawing on every pair and timeframe, and reset zoom and scroll">Clear all</button>'
    +(tool?`<span class="text-xs text-zinc-400 ml-2">${tool==='hline'?'Click the chart to place a level':first?'Click a second point':'Click a first point'} · Esc cancels</span>`:'');
  $('main').classList.toggle('cr',!!tool)}
mainC.subscribeCrosshairMove(p=>{prev=p.point||null});
mainC.subscribeClick(p=>{
  if(!tool||!p.point)return;const se=activeSeries(),price=se.coordinateToPrice(p.point.y),time=p.time||mainC.timeScale().coordinateToTime(p.point.x);
  if(price==null||!time)return;const pt={time,price:+price.toFixed(PAIRS[state.pair].d)},k=key();draws[k]=draws[k]||[];
  if(tool==='hline'){draws[k].push({type:'hline',p1:pt,p2:pt});tool=null}
  else if(!first)first=pt;else{if(pt.time===first.time)return;draws[k].push({type:'trend',p1:first,p2:pt});first=null;tool=null}
  drawBar();analyzeDraws()});
function overlay(){
  const box=cv.parentNode,w=box.clientWidth,h=box.clientHeight,dp=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dp)||cv.height!==Math.round(h*dp)){cv.width=Math.round(w*dp);cv.height=Math.round(h*dp);cv.style.width=w+'px';cv.style.height=h+'px'}
  cx.setTransform(dp,0,0,dp,0,0);cx.clearRect(0,0,w,h);
  const L=draws[key()]||[];if(!L.length&&!first)return;
  const ts=mainC.timeScale(),se=activeSeries(),pw=ts.width();
  cx.save();cx.beginPath();cx.rect(0,0,pw,h-28);cx.clip();cx.lineWidth=1.5;cx.font='11px Figtree, sans-serif';
  L.forEach((d,i)=>{const c=PAL[i%4],y1=se.priceToCoordinate(d.p1.price);cx.strokeStyle=c;cx.fillStyle=c;cx.lineWidth=i===sel?3:1.5;if(y1==null)return;
    if(d.type==='hline'){cx.setLineDash([6,4]);line(0,y1,pw,y1);cx.setLineDash([]);cx.fillText('L'+(i+1)+' '+fmt(d.p1.price),8,y1-5);return}
    const x1=ts.timeToCoordinate(d.p1.time),x2=ts.timeToCoordinate(d.p2.time),y2=se.priceToCoordinate(d.p2.price);
    if(x1==null||x2==null||y2==null||x1===x2)return;
    const ex=Math.max(pw,x2),ey=y2+(y2-y1)*(ex-x2)/(x2-x1);line(x1,y1,ex,ey);dot(x1,y1,i===sel?6:3.5);dot(x2,y2,i===sel?6:3.5);cx.fillText('L'+(i+1),x1+6,y1-6)});
  if(first&&prev){const x=ts.timeToCoordinate(first.time),y=se.priceToCoordinate(first.price);
    if(x!=null&&y!=null){cx.strokeStyle=cx.fillStyle='#e4e4e7';cx.setLineDash([4,4]);line(x,y,prev.x,prev.y);cx.setLineDash([]);dot(x,y)}}
  cx.restore()}
function analyzeDraws(){
  const L=draws[key()]||[],el=$('drawAI');el.classList.toggle('hidden',!L.length);if(!L.length||data.length<20)return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT'&&el.contains(document.activeElement))return;
  const last=data[data.length-1],px=last.close,step=TFS[state.tf][0],tol=avg(data.slice(-14).map(b=>b.high-b.low))*.3;
  el.innerHTML='<h2 class="text-sm text-zinc-400">Drawing analysis</h2><div class="divide-y divide-zinc-800 text-sm">'+L.map((d,i)=>{
    let at=()=>d.p1.price,name='Horizontal level',slope='';
    if(d.type==='trend'){const s=(d.p2.price-d.p1.price)/(d.p2.time-d.p1.time);at=t=>d.p1.price+s*(t-d.p1.time);
      name=s>0?'Rising trend line':s<0?'Falling trend line':'Flat trend line';
      slope=` · slope ${(s*step/at(last.time)*100).toFixed(3)}% per bar · 10 bars ahead ${fmt(at(last.time+10*step))}`}
    const v=at(last.time),pct=(px-v)/v*100,t0=d.type==='trend'?Math.min(d.p1.time,d.p2.time):0;
    let touches=0,was=false,cross=0,ps=null;
    data.forEach(b=>{if(b.time<t0)return;const l=at(b.time),hit=b.low<=l+tol&&b.high>=l-tol;if(hit&&!was)touches++;was=hit;const sd=b.close>l;if(ps!==null&&sd!==ps)cross++;ps=sd});
    const pb=data[data.length-4],now=px>v,before=pb.close>at(pb.time);
    const st=before!==now?(now?'Fresh breakout above the line':'Fresh breakdown below the line'):now?'Holding above, acting as support':'Trading below, acting as resistance';
    return `<div class="py-2 ${i===sel?'bg-zinc-900 -mx-2 px-2 rounded':''}"><div class="flex items-center justify-between gap-2"><button data-selx="${i}" class="font-medium text-left" style="color:${PAL[i%4]}">L${i+1} · ${name}</button>${d.type==='hline'?`<input data-price="${i}" value="${d.p1.price}" inputmode="decimal" aria-label="Level price" class="w-24 bg-zinc-900 border border-zinc-700 rounded px-2 py-0.5 text-right text-xs">`:`<span class="font-medium">${fmt(v)}</span>`}<button data-del="${i}" class="chip" style="padding:.1rem .6rem">Delete</button></div><div class="mt-1 text-xs text-zinc-400 leading-relaxed">${st}. Price is ${pct>=0?'+':''}${pct.toFixed(2)}% from the line · ${touches} touch${touches===1?'':'es'} · ${cross} cross${cross===1?'':'es'}${slope}</div></div>`}).join('')+'</div>'}


/* ---------- select / drag / delete drawings ---------- */
let sel=null,drag=null;
const box=cv.parentNode,ptr=e=>{const r=box.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const idxOf=t=>{let bi=0,bd=1e18;data.forEach((b,i)=>{const d=Math.abs(b.time-t);if(d<bd){bd=d;bi=i}});return bi};
const atX=x=>{const g=mainC.timeScale().coordinateToLogical(x),n=data.length;return g==null?n-1:Math.max(0,Math.min(n-1,Math.round(g)))};
function geo(d){
  const ts=mainC.timeScale(),se=activeSeries(),pw=ts.width(),y1=se.priceToCoordinate(d.p1.price);if(y1==null)return null;
  if(d.type==='hline')return{h:1,y:y1,pw};
  const x1=ts.timeToCoordinate(d.p1.time),x2=ts.timeToCoordinate(d.p2.time),y2=se.priceToCoordinate(d.p2.price);
  if(x1==null||x2==null||y2==null||x1===x2)return null;
  const ex=Math.max(pw,x2);return{x1,y1,x2,y2,pw,ex,ey:y2+(y2-y1)*(ex-x2)/(x2-x1)}}
function hit(x,y){
  const L=draws[key()]||[];
  for(let i=L.length-1;i>=0;i--){const g=geo(L[i]);if(!g||x>g.pw)continue;
    if(g.h){if(Math.abs(y-g.y)<=6)return{i,part:'body'};continue}
    if(Math.hypot(x-g.x1,y-g.y1)<=9)return{i,part:'p1'};
    if(Math.hypot(x-g.x2,y-g.y2)<=9)return{i,part:'p2'};
    const dx=g.ex-g.x1,dy=g.ey-g.y1,t=Math.max(0,Math.min(1,((x-g.x1)*dx+(y-g.y1)*dy)/(dx*dx+dy*dy)));
    if(Math.hypot(x-(g.x1+t*dx),y-(g.y1+t*dy))<=6)return{i,part:'body'}}
  return null}
box.addEventListener('pointerdown',e=>{
  if(tool||e.button)return;const[x,y]=ptr(e),h=hit(x,y);
  if(!h){if(sel!=null){sel=null;analyzeDraws()}return}
  e.stopPropagation();e.preventDefault();sel=h.i;const d=draws[key()][h.i];
  drag={i:h.i,part:h.part,i0:atX(x),o:JSON.parse(JSON.stringify(d)),n1:idxOf(d.p1.time),n2:idxOf(d.p2.time),pr0:activeSeries().coordinateToPrice(y)};
  analyzeDraws()},true);
window.addEventListener('pointermove',e=>{
  const[x,y]=ptr(e);
  if(!drag){if(tool||!box.contains(e.target)){$('main').classList.remove('mv');return}$('main').classList.toggle('mv',!!hit(x,y));return}
  const d=(draws[key()]||[])[drag.i];if(!d)return;
  const pr=activeSeries().coordinateToPrice(y);if(pr==null)return;
  const dp=PAIRS[state.pair].d,rd=v=>+v.toFixed(dp),o=drag.o,dP=pr-drag.pr0,di=atX(x)-drag.i0,T=i=>data[Math.max(0,Math.min(data.length-1,i))].time;
  if(o.type==='hline')d.p1.price=d.p2.price=rd(o.p1.price+dP);
  else if(drag.part==='p1')d.p1={time:T(atX(x)),price:rd(pr)};
  else if(drag.part==='p2')d.p2={time:T(atX(x)),price:rd(pr)};
  else{d.p1={time:T(drag.n1+di),price:rd(o.p1.price+dP)};d.p2={time:T(drag.n2+di),price:rd(o.p2.price+dP)}}
  if(d.type==='trend'&&d.p1.time===d.p2.time){d.p1=o.p1;d.p2=o.p2}
  analyzeDraws()});
window.addEventListener('pointerup',()=>{drag=null});
document.addEventListener('change',e=>{
  const i=e.target.dataset&&e.target.dataset.price;if(i==null)return;
  const d=(draws[key()]||[])[+i],v=parseFloat(e.target.value);if(d&&isFinite(v))d.p1.price=d.p2.price=v;e.target.blur();analyzeDraws()});

/* ---------- render ---------- */
function paint(keep){
  const P=PAIRS[state.pair],pf={type:'price',precision:P.d,minMove:1/10**P.d};
  const first=data[0],last=data[data.length-1],chg=(last.close/first.open-1)*100,upT=chg>=0,col=upT?'#00ff85':'#ff2d55';
  const s2=smaOf(data,20),s5=smaOf(data,50),bb=bollinger(data),rs=rsiOf(data);
  const m=a=>new Map(a.filter(x=>x.value!=null).map(x=>[x.time,x.value]));
  ind={m20:m(s2),m50:m(s5)};closeMap=new Map(data.map(b=>[b.time,b.close]));rsiMap=m(rs);
  [candle,area,s20,s50,bbU,bbM,bbL].forEach(s=>s.applyOptions({priceFormat:pf}));
  candle.setData(data);
  area.setData(data.map(b=>({time:b.time,value:b.close})));
  area.applyOptions({lineColor:col,topColor:col+'40',bottomColor:col+'00'});
  s20.setData(s2);s50.setData(s5);bbU.setData(bb.u);bbM.setData(bb.m);bbL.setData(bb.l);rsiS.setData(rs);
  const I=state.ind;
  candle.applyOptions({visible:state.type==='candle'});area.applyOptions({visible:state.type==='line'});
  s20.applyOptions({visible:!!I.sma20});s50.applyOptions({visible:!!I.sma50});
  [bbU,bbM,bbL].forEach(s=>s.applyOptions({visible:!!I.bb}));
  $('rsiWrap').classList.toggle('hidden',!I.rsi);
  const intraday=TFS[state.tf][0]<86400;
  mainC.applyOptions({timeScale:{timeVisible:intraday,secondsVisible:false}});
  if(!keep)requestAnimationFrame(()=>{mainC.timeScale().fitContent();const r=mainC.timeScale().getVisibleLogicalRange();if(r)rsiC.timeScale().setVisibleLogicalRange(r)});
  setLegend(last,last.time);
  // header
  $('pairName').textContent=state.pair;$('price').textContent=fmt(last.close);
  const el=$('chg');el.className='text-sm font-medium '+(upT?'up':'down');
  el.textContent=`${upT?'+':''}${(last.close-first.open).toFixed(P.d)} (${upT?'+':''}${chg.toFixed(2)}%) · ${TFS[state.tf][2]}`;
  lv=sr(data);drawSR();insights(data,s2,s5,bb,rs,chg);runAIEngine(data,s2,s5,bb,rs);analyzeDraws();
  drawControls();
}

function insights(d,s2,s5,bb,rs,chg){
  const last=d[d.length-1],v20=s2.at(-1).value,v50=s5.at(-1).value,slope=s5.at(-1).value-s5.at(-11).value;
  const bw=bb.u.map((x,i)=>x.value!=null?(x.value-bb.l[i].value)/bb.m[i].value:null).filter(x=>x!=null);
  const pct=bw.filter(x=>x<=bw.at(-1)).length/bw.length;
  const bull=last.close>v50&&v20>v50&&slope>0,bear=last.close<v50&&v20<v50&&slope<0;
  const dir=bull?'Bullish':bear?'Bearish':'Neutral',st=pct<.35?'consolidation':'trend';
  const label=dir==='Neutral'?'Range-bound':`${dir} ${st}`;
  const r=rs.at(-1).value,rr=r>70?'Overbought':r<30?'Oversold':r>55?'Leaning strong':r<45?'Leaning weak':'Balanced';
  const w=d.slice(-30),hi=Math.max(...w.map(b=>b.high)),lo=Math.min(...w.map(b=>b.low));
  const atr=avg(d.slice(-14).map(b=>(b.high-b.low)/b.close*100));
  $('trend').innerHTML=`<span class="${bull?'up':bear?'down':''}">${label}</span>`;
  $('summary').textContent=`Price is ${last.close>v50?'above':'below'} its 50-period average and the 20-period average is ${v20>v50?'above':'below'} it. Bollinger band width is in the ${Math.round(pct*100)}th percentile of this window, so volatility is ${pct<.35?'compressed':pct>.7?'expanded':'moderate'}.`;
  const row=(k,v,c='')=>`<div class="flex justify-between py-2"><dt class="text-zinc-400">${k}</dt><dd class="font-medium ${c}">${v}</dd></div>`;
  $('stats').innerHTML=row(TFS[state.tf][2]+' change',`${chg>=0?'+':''}${chg.toFixed(2)}%`,chg>=0?'up':'down')
    +row('RSI (14)',`${r.toFixed(1)} · ${rr}`,r>70?'down':r<30?'up':'')
    +row('Nearest support',fmt(lv.S[0]))+row('Nearest resistance',fmt(lv.R[0]))
    +row('Range high',fmt(Math.max(...d.map(b=>b.high))))+row('Range low',fmt(Math.min(...d.map(b=>b.low))))
    +row('Average bar range',atr.toFixed(2)+'%');
}

/* ---------- controls ---------- */
function drawControls(){drawBar();
  $('pairSel').value=state.pair;
  $('tfs').innerHTML=Object.keys(TFS).map(t=>`<button class="chip ${t===state.tf?'on':''}" data-tf="${t}">${t}</button>`).join('');
  $('tools').innerHTML=TOOLS.map(t=>{
    if(t==='|')return'<span class="w-px bg-zinc-800 mx-1 shrink-0"></span>';
    const [k,n,c]=t,isType=k==='candle'||k==='line',on=isType?state.type===k:state.ind[k];
    return isType?`<button class="chip ${on?'on':''}" data-type="${k}">${n}</button>`
      :`<button class="chip pill ${on?'on':''}" style="--c:${c}" data-ind="${k}" aria-pressed="${!!on}"><i></i>${n}</button>`}).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.pair)state.pair=d.pair;else if(d.tf){state.tf=d.tf;sel=null}else if(d.type)state.type=d.type;else if(d.ind)state.ind[d.ind]^=1;else if(d.tool){tool=tool===d.tool?null:d.tool;first=null;drawBar();return}else if(d.act){if(d.act==='undo')(draws[key()]||[]).pop();else if(d.act==='clearall'){if(Object.values(draws).some(l=>l.length)&&!confirm('Remove all drawings on every pair and timeframe, and reset the chart view?'))return;for(const k in draws)delete draws[k];tool=null;first=null;sel=null;drag=null;drawBar();mainC.priceScale('right').applyOptions({autoScale:true});mainC.timeScale().fitContent()}else draws[key()]=[];analyzeDraws();return}else if(d.del!==undefined){(draws[key()]||[]).splice(+d.del,1);sel=null;analyzeDraws();return}else if(d.selx!==undefined){sel=+d.selx;analyzeDraws();return}else return;
  load();
});
$('pairSel').innerHTML=Object.keys(PAIRS).map(p=>`<option value="${p}">${p}</option>`).join('');
$('pairSel').addEventListener('change',e=>{state.pair=e.target.value;sel=null;load()});
try{$('key').value=localStorage.getItem('avkey')||''}catch(e){}
$('key').addEventListener('change',()=>{try{localStorage.setItem('avkey',$('key').value.trim())}catch(e){}cache.clear();load()});
$('refresh').addEventListener('click',()=>{cache.clear();load(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){tool=null;first=null;sel=null;drawBar();analyzeDraws()}if((e.key==='Delete'||e.key==='Backspace')&&sel!=null&&!/INPUT/.test(document.activeElement.tagName)){const L=draws[key()]||[];if(L[sel]){L.splice(sel,1);sel=null;analyzeDraws();e.preventDefault()}}});
requestAnimationFrame(function f(){overlay();requestAnimationFrame(f)});
load();
</script>
