<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#E3E8EF;--gold:#B8860B;--err:#C0394F;--ok:#1F8F5F}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--card:#111114;--ink:#e4e4e7;--mut:#a1a1aa;--line:#27272a;--gold:#E0B04A;--err:#F0788A;--ok:#4ACB93}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.logo{display:block;margin:0 auto 8px;width:84px;height:84px;object-fit:contain}
h1{margin:0 0 4px;font-size:1.25rem;text-align:center}.sub{margin:0 0 18px;color:var(--mut);font-size:.9rem;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{border:0;border-radius:8px;padding:8px;background:transparent;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
form{display:none}form.on{display:block}
label{display:block;margin:12px 0 4px;font-size:.85rem;font-weight:600}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-size:.8rem;padding:6px}
.go{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;background:var(--gold);color:#1a1200;font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.link{display:block;margin:12px auto 0;border:0;background:none;color:var(--mut);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer}
#msg{min-height:1.4em;margin-top:14px;font-size:.88rem;text-align:center}#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.fine{margin:18px 0 0;color:var(--mut);font-size:.75rem;text-align:center}

<h1>Gold Diggers FX</h1><p class="sub" id="sub">Sign in to open your dashboard</p>
<div class="tabs" role="tablist"><button id="tIn" role="tab" aria-selected="true">Sign in</button><button id="tUp" role="tab" aria-selected="false">Create account</button></div>

<form id="fIn" class="on" autocomplete="on"><label for="siU">Username or email</label><input id="siU" autocomplete="username" required>
 <label for="siP">Password</label><div class="pw"><input id="siP" type="password" autocomplete="current-password" required><button type="button" data-show="siP">Show</button></div>
 <button class="go" type="submit">Sign in</button><button class="link" type="button" id="toForgot">Forgot your password?</button></form>

<form id="fUp"><label for="suU">Username</label><input id="suU" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" title="3 to 20 letters, numbers or underscores">
 <label for="suE">Email (for password resets)</label><input id="suE" type="email" autocomplete="email" required>
 <label for="suP">Password (at least 8 characters)</label><div class="pw"><input id="suP" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-show="suP">Show</button></div>
 <label for="suC">Confirm password</label><input id="suC" type="password" autocomplete="new-password" required minlength="8">
 <button class="go" type="submit">Create account</button></form>

<form id="fFg"><label for="fgE">Account email</label><input id="fgE" type="email" autocomplete="email" required>
 <button class="go" type="submit">Send reset link</button><button class="link" type="button" id="toIn">Back to sign in</button></form>

<form id="fRs"><label for="rsP">New password (at least 8 characters)</label><div class="pw"><input id="rsP" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-show="rsP">Show</button></div>
 <button class="go" type="submit">Save new password</button></form>

<div id="msg" role="status" aria-live="polite"></div>
<p class="fine">Educational tool, not financial advice. Trading leveraged products carries a high risk of loss.</p>
</main>
<script>
const $=id=>document.getElementById(id),C=window.GDFX||{},ok=!!(C.url&&C.anonKey&&!/YOUR_/.test(C.url+C.anonKey));
const sb=ok?supabase.createClient(C.url,C.anonKey):null;
const nextUrl=(()=>{const n=new URLSearchParams(location.search).get('next')||'';return /^[\w.-]+\.html?$/.test(n)?n:'index.html'})();
const msg=(t,k)=>{$('msg').textContent=t||'';$('msg').className=k||''},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FORMS={in:'fIn',up:'fUp',fg:'fFg',rs:'fRs'};
function show(m){Object.entries(FORMS).forEach(([k,id])=>$(id).classList.toggle('on',k===m));
  $('tIn').setAttribute('aria-selected',m==='in');$('tUp').setAttribute('aria-selected',m==='up');document.querySelector('.tabs').style.display=(m==='in'||m==='up')?'':'none';
  $('sub').textContent={in:'Sign in to open your dashboard',up:'Create your account',fg:'Reset your password',rs:'Choose a new password'}[m];msg('')}
$('tIn').onclick=()=>show('in');$('tUp').onclick=()=>show('up');$('toForgot').onclick=()=>show('fg');$('toIn').onclick=()=>show('in');
document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.show),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show'});
async function run(f,fn){f.onsubmit=async e=>{e.preventDefault();if(!ok){msg('Sign-in is not set up yet. Add your Supabase URL and anon key to auth-config.js.','err');return}
  const b=f.querySelector('.go');b.disabled=true;try{await fn()}catch(err){msg(err.message||'Something went wrong. Please try again.','err');await sleep(800)}finally{b.disabled=false}}}
run($('fIn'),async()=>{const u=$('siU').value.trim();let email=u;
  try{if(!u.includes('@')){const{data,error}=await sb.rpc('email_for_username',{u});if(error||!data)throw 0;email=data}
    const{error}=await sb.auth.signInWithPassword({email,password:$('siP').value});if(error)throw error;location.replace(nextUrl)}
  catch(e){throw new Error(e&&/confirm/i.test(e.message||'')?'Please confirm your email first, then sign in.':'Incorrect username or password.')}});
run($('fUp'),async()=>{const u=$('suU').value.trim().toLowerCase(),em=$('suE').value.trim(),p=$('suP').value;
  if(!/^[a-z0-9_]{3,20}$/.test(u))throw new Error('Username must be 3 to 20 letters, numbers or underscores.');
  if(p!==$('suC').value)throw new Error('The passwords do not match.');
  const{data:taken}=await sb.rpc('username_taken',{u});if(taken)throw new Error('That username is taken. Try another.');
  const{data,error}=await sb.auth.signUp({email:em,password:p,options:{data:{username:u},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
  if(data.session)location.replace(nextUrl);else{show('in');msg('Account created. Check your email to confirm it, then sign in.','ok')}});
run($('fFg'),async()=>{const{error}=await sb.auth.resetPasswordForEmail($('fgE').value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;msg('If an account exists for that email, a reset link is on its way.','ok')});
run($('fRs'),async()=>{const{error}=await sb.auth.updateUser({password:$('rsP').value});if(error)throw error;msg('Password updated. Opening your dashboard...','ok');await sleep(900);location.replace(nextUrl)});
if(ok){sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')show('rs')});
  sb.auth.getSession().then(({data})=>{if(data.session&&!/type=recovery/.test(location.hash))location.replace(nextUrl)})}
else msg('Not set up yet: add your Supabase URL and anon key to auth-config.js.','err');
</script></body></html>
